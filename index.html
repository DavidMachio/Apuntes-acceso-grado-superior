<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programa formativo: nombre del curso</title>
  <meta name="description" content="Programa formativo con el contenido de cada módulo y los materiales en PDF.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <div class="cabecera__in">
      <div class="cabecera__texto">
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
      </div>
      <dl id="ficha" class="ficha"></dl>
    </div>
  </header>

  <div class="cuerpo">
    <nav class="indice" aria-label="Módulos del programa">
      <h2>Módulos</h2>
      <ol id="indice"></ol>
    </nav>

    <main id="contenido">
      <section class="presentacion" aria-labelledby="h-presentacion">
        <h2 id="h-presentacion">Presentación</h2>
        <div id="descripcion"></div>
      </section>
      <div id="modulos"></div>
      <noscript><p>Esta página necesita JavaScript para mostrar el programa.</p></noscript>
    </main>
  </div>

  <footer class="pie">
    <p id="pie"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
